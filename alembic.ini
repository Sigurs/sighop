# Alembic configuration.
#
# There is deliberately no `sqlalchemy.url` here. The URL comes from
# `src/sighop/config.py`, which is the one place that validates the driver and
# the query parameters and redacts the password (design D1, D9). A URL in this
# file would be a second source of truth, and the one most likely to be
# committed with a password in it.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
