# gitleaks configuration: the default rules, minus generated protocol fixtures.
#
# The corpus and its golden file are full of hex that `generic-api-key` reads as
# secrets: advert public keys (broadcast over the air by design), ciphertext
# digests, MACs and path hashes. They are generated by tests/protocol/synthetic.py
# and tests/protocol/generate_golden.py and carry no credentials.

[extend]
useDefault = true

[[allowlists]]
description = "Generated protocol corpus and golden file"
paths = [
    '''^tests/corpus/''',
    '''^tests/protocol/corpus_golden\.txt$''',
]
