[project]
name = "sighop"
version = "0.1.0"
description = "A virtualization platform for MeshCore over a KISS modem"
requires-python = ">=3.13"
dependencies = [
    "pyserial-asyncio>=0.6",
    "structlog>=24.1",
]

[project.scripts]
sighop = "sighop.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
